<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SideNote Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo-mark">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <div class="title-group">
          <span class="app-title">SideNote Pro</span>
          <span class="domain-tag" id="domainTag">Detecting...</span>
        </div>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="proStatusBtn" title="License Status">
          <span class="badge" id="proBadge">Free</span>
        </button>
      </div>
    </header>

    <!-- Scope Tabs -->
    <div class="nav-tabs">
      <button class="nav-tab active" id="tabSite">This Site</button>
      <button class="nav-tab" id="tabGlobal">Global Vault</button>
      <button class="nav-tab" id="tabAll">All Sites</button>
    </div>

    <!-- Main Editor / Preview View -->
    <main class="editor-view" id="editorView">
      <!-- Formatting Toolbar -->
      <div class="toolbar">
        <button class="tool-btn" id="btnBold" title="Bold">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path></svg>
        </button>
        <button class="tool-btn" id="btnItalic" title="Italic">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="4" x2="10" y2="4"></line><line x1="14" y1="20" x2="5" y2="20"></line><line x1="15" y1="4" x2="9" y2="20"></line></svg>
        </button>
        <button class="tool-btn" id="btnHeading" title="Heading">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 12h16"></path><path d="M4 4v16"></path><path d="M20 4v16"></path></svg>
        </button>
        <button class="tool-btn" id="btnChecklist" title="Checklist">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
        </button>
        <button class="tool-btn" id="btnCode" title="Code">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
        </button>
        <button class="tool-btn" id="btnQuote" title="Quote">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"></path><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"></path></svg>
        </button>
        <div class="tool-divider"></div>
        <button class="tool-btn-text" id="btnTogglePreview">Preview</button>
      </div>

      <!-- Textarea Container -->
      <div class="editor-container">
        <textarea id="noteInput" placeholder="Write markdown notes, paste URLs, or checklists for this website..." spellcheck="false"></textarea>
        <div id="notePreview" class="markdown-preview hidden"></div>
      </div>

      <!-- Metadata & Auto-save bar -->
      <div class="editor-meta">
        <div class="meta-left">
          <span class="save-status" id="saveStatus">Saved</span>
        </div>
        <div class="meta-right">
          <span id="charCount">0 words</span>
        </div>
      </div>

      <!-- Footer Action Buttons -->
      <div class="editor-actions">
        <button class="btn btn-secondary btn-sm" id="btnCopyNote">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          Copy
        </button>
        <button class="btn btn-secondary btn-sm" id="btnExportMd">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Export .md
        </button>
        <button class="btn btn-secondary btn-sm btn-danger" id="btnClearNote">
          Clear
        </button>
      </div>
    </main>

    <!-- All Sites Drawer View -->
    <div class="sites-view hidden" id="sitesView">
      <div class="sites-header">
        <input type="text" id="searchSitesInput" placeholder="Search domain notes..." spellcheck="false">
      </div>
      <div class="sites-list" id="sitesList">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- Upgrade / Pro Modal (Strictly position: absolute within container) -->
    <div class="modal-overlay hidden" id="upgradeModal">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Upgrade to SideNote Pro</h3>
          <button class="close-btn" id="closeModalBtn">&times;</button>
        </div>
        <p class="modal-sub">Keep your research and website context synced locally forever.</p>
        
        <div class="modal-perks">
          <div class="perk-row">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
            <span>Unlimited domain sticky notes</span>
          </div>
          <div class="perk-row">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
            <span>All-sites searchable drawer</span>
          </div>
          <div class="perk-row">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
            <span>One-click .md batch exports</span>
          </div>
          <div class="perk-row">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
            <span>100% on-device private & offline</span>
          </div>
        </div>

        <a href="https://micro-software-lab.lemonsqueezy.com/checkout/buy/3dfdbeb4-d743-4fff-9328-c293507b80ab" target="_blank" class="btn btn-primary btn-block">Get Lifetime License - $4.99</a>

        <div class="license-form">
          <input type="text" id="licenseKeyInput" placeholder="Paste license key here...">
          <button class="btn btn-secondary btn-sm" id="btnActivateLicense">Activate</button>
        </div>
        <div class="license-status-msg" id="licenseMsg"></div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
